<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學園好食 全版金句卡</title>
<style>
  :root {
    --orange: #dd7d1b; --yellow: #f9b625; --teal: #3cb1c8; --cream: #fff8ec; --ink: #2b2118;
    --ui-bg: #1b1a19; --ui-panel: #262523; --ui-line: #3a3835; --ui-text: #ece8e1; --ui-dim: #a29d94;
  }
  html, body { margin: 0; background: var(--ui-bg); color: var(--ui-text); font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
  html.render, body.render { background: transparent; overflow: hidden; }
  #wrap { max-width: 1280px; margin: 0 auto; padding: 16px; box-sizing: border-box; }
  h1 { font-size: 18px; font-weight: 700; margin: 4px 0 12px; }
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; background: #000; }
  body.render #wrap { padding: 0; max-width: none; }
  body.render #wrap > :not(#stage) { display: none; }
  body.render #stage { width: 1920px; height: 1080px; aspect-ratio: auto; border-radius: 0; }

  #scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
  .bg { position: absolute; inset: 0; }
  .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(40, 28, 10, .35) 100%); }

  /* 撕紙條 */
  .piece { position: absolute; filter: drop-shadow(3px 6px 5px rgba(20, 12, 0, .38)); }
  .fiber, .paper, .crumple { position: absolute; }
  .fiber { background: #fbf8f1; }
  .paper { background-size: 900px auto; }
  .crumple { background: url(textures/Paper003.jpg) center / 700px auto; mix-blend-mode: multiply; filter: contrast(1.6) brightness(1.05); }
  .dark { position: absolute; background: #2a1d0c; }
  .content { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .doodle { position: absolute; overflow: visible; }
  .doodle path { fill: none; stroke: var(--orange); stroke-linecap: round; stroke-linejoin: round; }

  /* 立體（立體書、明信片） */
  #world { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 45%; }
  .panel { position: absolute; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; background: url(textures/Paper001.jpg) 0 0 / 900px auto; }
  .shade { position: absolute; inset: 0; background: #2a1d0c; opacity: 0; }

  /* 乾淨排版 */
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); }
  .ln { position: absolute; left: 0; width: 1920px; text-align: center; white-space: nowrap; }
  .ch { display: inline-block; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 12px;
    background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 8px; padding: 10px 12px; }
  .bar label { font-size: 13px; color: var(--ui-dim); display: flex; gap: 6px; align-items: center; }
  .bar select, .bar textarea { background: var(--ui-bg); color: var(--ui-text); border: 1px solid var(--ui-line);
    border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 14px; }
  .bar textarea { width: min(300px, 70vw); height: 70px; resize: vertical; }
  button { background: var(--orange); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  #scrub { flex: 1; min-width: 160px; accent-color: var(--orange); }
  #time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ui-dim); min-width: 92px; text-align: right; }
</style>
</head>
<body>
<div id="wrap">
  <h1>學園好食 全版金句卡</h1>
  <div id="stage"><div id="scene"></div></div>
  <div class="bar">
    <button id="play">暫停</button>
    <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0">
    <span id="time">0.00 / 0.00</span>
  </div>
  <div class="bar">
    <label>造型 <select id="style"><option value="strip">撕紙條</option><option value="clean">乾淨排版</option><option value="tear">撕開露字</option><option value="popup">立體書</option><option value="layers">剪紙景深</option><option value="envelope">信封</option></select></label>
    <label>變體 <select id="v"><option value="">原版</option><option value="1">變體 1</option><option value="2">變體 2</option><option value="3">變體 3</option></select></label>
    <label>金句（換行分句，# 開頭那句是藍色） <textarea id="title"></textarea></label>
  </div>
</div>

<script>
const W = 1920, H = 1080;
const STOP_FPS = 12;
// 文字動畫固定 5 秒，前後各留一段靜止畫面方便剪接
const ANIM = 5;
const q = new URLSearchParams(location.search);
const num = (v, d) => (v == null || v === '' || isNaN(+v)) ? d : Math.max(0, +v);
const P = {
  style: q.get('style') || 'strip',
  title: q.get('title') || '#友誼不進則退\n單看你願意主動多少\n主動的人必有收穫！',
  pre: num(q.get('pre'), 2),
  post: num(q.get('post'), 2),
  // 變體編號：空白是原版，1、2、3 是變體
  v: q.get('v') || '',
  // 配合台詞：每一句開始講的秒數（從文字動畫開始算），例如 0,1.5,3.5；不寫就用各樣式原本的節奏
  cue: (q.get('cue') || '').split(/[,，｜|]/).map(x => x.trim()).filter(Boolean).map(Number).filter(Number.isFinite),
  render: q.has('render'),
};
const CUE = P.cue.length ? P.cue : null;
if (P.render) { document.documentElement.classList.add('render'); document.body.classList.add('render'); }

const INK = '#2b2118', ORANGE = '#dd7d1b', YELLOW = '#f9b625';
// hashtag 用品牌藍綠色，壓深一點，在白紙上才看得清楚
const TAG = '#1e9ab4';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, start, dur) => clamp((t - start) / dur);
const lerp = (a, b, x) => a + (b - a) * x;
const ease = {
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646); }
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };

const FONT_ROUND = "'Yuanti TC', 'jf open 粉圓 2.1', 'jf-openhuninn-2.1', 'Noto Sans TC', sans-serif";
const FONT_BOLD = "'Noto Sans TC', 'PingFang TC', sans-serif";
const TEX = { white: 'textures/Paper001.jpg', crease: 'textures/Paper003.jpg', kraft: 'textures/Paper006.jpg', grey: 'textures/Paper002.jpg' };

const scene = document.getElementById('scene');
const cvs = document.createElement('canvas').getContext('2d');
const measure = (s, font) => { cvs.font = font; return cvs.measureText(s).width; };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const lines = () => P.title.split('\n').map(s => s.trim()).filter(Boolean);
const isTag = l => /^[#＃]/.test(l);
const colorOf = l => isTag(l) ? TAG : INK;
// 最後一句最大，其他一樣大；太寬的那句自己縮小
function sizesFor(ls, base, big, maxW, font) {
  return ls.map((l, i) => {
    let s = i === ls.length - 1 ? big : base;
    const w = measure(l, font(s)) * 1.06;
    return w > maxW ? s * maxW / w : s;
  });
}

/* ---------- 撕紙形狀（跟 titles.html 一樣） ---------- */
function torn(w, h, amp, r, step = 11) {
  const pts = [];
  const edge = (x0, y0, x1, y1, a, nx, ny) => {
    const len = Math.hypot(x1 - x0, y1 - y0);
    let d = 0;
    while (d < len) {
      const k = d / len, j = a * (.35 + .65 * r()) * (.7 + .3 * Math.sin(d * .05 + r() * 6));
      pts.push([x0 + (x1 - x0) * k + nx * j, y0 + (y1 - y0) * k + ny * j]);
      d += step * (.6 + r() * .8);
    }
  };
  edge(0, 0, w, 0, amp[0], 0, 1);
  edge(w, 0, w, h, amp[1], -1, 0);
  edge(w, h, 0, h, amp[2], 0, -1);
  edge(0, h, 0, 0, amp[3], 1, 0);
  return pts;
}
function blobOf(pts, w, h, r) {
  const R = Math.min(w, h) * .62;
  return pts.map(([x, y]) => {
    const a = Math.atan2((y - h / 2) / h, (x - w / 2) / w);
    const rr = R * (.7 + .55 * r());
    return [w / 2 + Math.cos(a) * rr, h / 2 + Math.sin(a) * rr * .85];
  });
}
const polyCSS = pts => `polygon(${pts.map(([x, y]) => `${x.toFixed(1)}px ${y.toFixed(1)}px`).join(',')})`;

let pieces = [], doodles = [], seedN = 1;
// tapes：會「啪」一下貼上去的膠帶；SCAM：撕紙條版的鏡頭（推近多少、轉多少度）
let tapes = [], SCAM = { rot: 0, push: .05 };
// 紙片和手繪線要放進哪一層（撕紙條版會放進可以推鏡的 #cam）
let root = scene;
// 有顏色的紙：紙張照片乘上顏色，保留紙紋
const paperBg = (color, tex = TEX.white, size = 900, pos = '0 0') => `background:url(${tex}) ${pos} / ${size}px auto, ${color};background-blend-mode:multiply`;
// 不會動的碎紙片（背景裝飾用）：撕邊、白色毛邊、陰影
function scrap(o, parent = root) {
  const r = rng(seedN++ * 6151);
  const f = 4, amp = o.amp || [6, 10, 6, 10];
  const lines = o.lines ? 'repeating-linear-gradient(180deg, transparent 0 34px, rgba(90,140,190,.35) 34px 36px),' : '';
  const el = document.createElement('div');
  el.className = 'piece';
  Object.assign(el.style, { left: o.x + 'px', top: o.y + 'px', width: o.w + 'px', height: o.h + 'px', zIndex: o.z || 1, transform: `rotate(${o.rot || 0}deg)` });
  el.innerHTML = `<div class="fiber" style="left:${-f}px;top:${-f}px;width:${o.w + f * 2}px;height:${o.h + f * 2}px;clip-path:${polyCSS(torn(o.w + f * 2, o.h + f * 2, amp.map(a => a * 1.3 + 1), r))}"></div>
    <div class="paper" style="inset:0;${lines ? `background:${lines}url(${o.tex || TEX.white}) 0 0 / 900px auto` : paperBg(o.color || '#fff', o.tex || TEX.white, 900, `${Math.floor(r() * 600)}px ${Math.floor(r() * 600)}px`)};clip-path:${polyCSS(torn(o.w, o.h, amp, r))}"></div>`;
  parent.appendChild(el);
  return el;
}
// 半透明紙膠帶，兩頭是鋸齒
function washi(o, parent = root) {
  const r = rng(seedN++ * 104729);
  const el = document.createElement('div');
  el.className = 'tape';
  Object.assign(el.style, { position: 'absolute', left: o.x + 'px', top: o.y + 'px', width: o.w + 'px', height: o.h + 'px', zIndex: o.z || 50,
    transform: `rotate(${o.rot || 0}deg)`, clipPath: polyCSS(torn(o.w, o.h, [1, 6, 1, 6], r, 6)),
    background: o.bg || 'rgba(244, 236, 206, .66)' });
  parent.appendChild(el);
  return el;
}
function makePiece(o) {
  const r = rng(o.seed || (seedN++ * 7919));
  const { w, h } = o;
  const amp = o.amp || [4, 10, 4, 10];
  const f = 4;
  const poly = torn(w, h, amp, r);
  const fpoly = torn(w + f * 2, h + f * 2, amp.map(a => a * 1.3 + 1), r);
  const el = document.createElement('div');
  el.className = 'piece';
  Object.assign(el.style, { left: o.x + 'px', top: o.y + 'px', width: w + 'px', height: h + 'px', zIndex: o.z || 1 });
  el.innerHTML = `<div class="fiber" style="left:${-f}px;top:${-f}px;width:${w + f * 2}px;height:${h + f * 2}px"></div>
    <div class="paper" style="inset:0;${paperBg(o.color || '#fff', o.tex, 900, `${Math.floor(r() * 600)}px ${Math.floor(r() * 600)}px`)}"></div>
    <div class="crumple" style="inset:0;opacity:.55"></div>
    <div class="dark" style="inset:0;opacity:0"></div>
    <div class="content">${o.html || ''}</div>`;
  root.appendChild(el);
  const p = {
    ...o, el, poly, fpoly, blob: blobOf(poly, w, h, r), fblob: blobOf(fpoly, w + f * 2, h + f * 2, r),
    fiberEl: el.querySelector('.fiber'), paperEl: el.querySelector('.paper'),
    crumpleEl: el.querySelector('.crumple'), darkEl: el.querySelector('.dark'), contentEl: el.querySelector('.content'),
    idx: pieces.length,
  };
  pieces.push(p);
  return p;
}
const DOODLE = {
  sparkle: 'M12 40 L28 50 M34 12 L40 32 M62 18 L50 36',
  swoosh: 'M2 60 C 30 40, 64 72, 98 46',
  star: 'M50 8 L60 40 L94 40 L66 60 L76 92 L50 72 L24 92 L34 60 L6 40 L40 40 Z',
};
function makeDoodle(o, parent = root) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  el.setAttribute('class', 'doodle');
  el.setAttribute('viewBox', '0 0 100 100');
  Object.assign(el.style, { left: o.x + 'px', top: o.y + 'px', width: o.size + 'px', height: o.size + 'px', zIndex: o.z || 60,
    transform: `rotate(${o.rot || 0}deg)` });
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', DOODLE[o.shape]);
  path.style.stroke = o.color || ORANGE;
  path.style.strokeWidth = 6 * (o.weight || 1);
  el.appendChild(path);
  parent.appendChild(el);
  const len = path.getTotalLength();
  path.style.strokeDasharray = len;
  const d = { ...o, el, path, len };
  doodles.push(d);
  return d;
}
function drawDoodles(a) {
  doodles.forEach(d => {
    const e = prog(a, d.t0, d.draw || .34);
    d.el.style.visibility = e > 0 ? 'visible' : 'hidden';
    d.path.style.strokeDashoffset = d.len * (1 - e);
  });
}

/* ================= 版本 1：撕紙條（全版紙張背景） ================= */
function buildStrip() {
  scene.innerHTML = `<div id="cam" style="position:absolute;inset:0;transform-origin:50% 50%"><div class="bg" style="background:url(${TEX.grey}) center / cover;filter:brightness(.88) saturate(.9)"></div></div><div class="vig"></div>`;
  root = scene.querySelector('#cam');
  // 背景：桌上散著幾張舊紙片和膠帶，都靠畫面邊緣，中間留給金句
  scrap({ x: -140, y: -90, w: 640, h: 400, rot: -8, tex: TEX.kraft, color: '#fff' });
  scrap({ x: 1460, y: 700, w: 600, h: 460, rot: 7, lines: true });
  scrap({ x: 1560, y: 70, w: 300, h: 210, rot: 11, color: '#f7c85a' });
  scrap({ x: 60, y: 820, w: 360, h: 230, rot: -6, color: '#9fd5e0' });
  scrap({ x: 330, y: 930, w: 260, h: 170, rot: 9, tex: TEX.crease, color: '#fff' });
  washi({ x: 300, y: 250, w: 190, h: 52, rot: -32, z: 5 });
  washi({ x: 1480, y: 720, w: 200, h: 52, rot: 24, z: 5 });
  washi({ x: 1640, y: 60, w: 150, h: 46, rot: -14, bg: 'rgba(60,177,200,.45)', z: 5 });
  const ls = lines();
  const font = s => `700 ${s}px ${FONT_ROUND}`;
  const sz = sizesFor(ls, 92, 144, 1500, font);
  const gap = 10;
  const total = sz.reduce((a, s) => a + s * 1.55, 0) + gap * (ls.length - 1);
  let y = (H - total) / 2;
  const r = rng(5);
  const rots = [-1.8, 1.5, -1.2];
  const out = [];
  ls.forEach((l, i) => {
    const s = sz[i], h = s * 1.55, w = measure(l, font(s)) * 1.08 + s * 1.1;
    const last = i === ls.length - 1;
    out.push(makePiece({ x: W / 2 - w / 2 + (r() - .5) * s * .5, y, w, h, rot: rots[i % 3], tex: TEX.white,
      amp: [5, 14, 5, 14], z: 10 + i, t0: CUE ? CUE[i] ?? CUE[CUE.length - 1] + 1 : .2 + i * .75 + (last ? .1 : 0), color: last ? YELLOW : '#fff',
      html: `<div style="font-family:${FONT_ROUND};font-weight:700;font-size:${s}px;color:${colorOf(l)};letter-spacing:.04em;white-space:nowrap">${esc(l)}</div>` }));
    y += h + gap;
  });
  const last = out[out.length - 1];
  const tDraw = last.t0 + .6;
  const sw = Math.min(600, last.w * .55);
  // 弧線畫在字的下緣外面，不壓到字
  const lastS = sz[sz.length - 1], swY = last.y + last.h / 2 + lastS * .5 + sw * .12;
  makeDoodle({ shape: 'swoosh', x: last.x + last.w / 2 - sw / 2 + 40, y: swY - sw * .53, size: sw, rot: last.rot - 2, t0: tDraw, draw: .4, weight: .7 });
  makeDoodle({ shape: 'sparkle', x: last.x + last.w - 50, y: last.y - 100, size: 140, rot: 10, t0: tDraw + .35 });
}
function renderStrip(a) {
  // 整段文字動畫裡，鏡頭很慢地推近一點
  const cam = ease.inOutCubic(prog(a, 0, ANIM));
  root.style.transform = `scale(${1 + SCAM.push * cam}) rotate(${SCAM.rot * (cam - .5)}deg)`;
  // 定格動畫：每秒 12 張；文字動畫結束後完全靜止
  const aq = Math.floor(clamp(a, -1, ANIM) * STOP_FPS + 1e-6) / STOP_FPS;
  const frame = Math.floor(clamp(a, 0, ANIM) * STOP_FPS + 1e-6);
  const still = a >= ANIM;
  pieces.forEach(p => {
    const inP = prog(aq, p.t0, .42);
    const vis = aq >= p.t0;
    p.el.style.visibility = vis ? 'visible' : 'hidden';
    if (!vis) return;
    const j = still ? 0 : 1;
    const jx = (hash(frame, p.idx) - .5) * 2 * j, jy = (hash(frame, p.idx + 50) - .5) * 2 * j, jr = (hash(frame, p.idx + 90) - .5) * .6 * j;
    if (p.anim === 'slide') {
      // 不揉紙的紙條：形狀一開始就是攤平的
      if (!p.flatSet) {
        p.paperEl.style.clipPath = p.darkEl.style.clipPath = polyCSS(p.poly);
        p.fiberEl.style.clipPath = polyCSS(p.fpoly);
        p.crumpleEl.style.opacity = 0; p.darkEl.style.opacity = 0; p.contentEl.style.opacity = 1;
        p.flatSet = true;
      }
      // 從畫面外被抽進來，稍微衝過頭再停住
      const k = ease.outBack(prog(aq, p.t0, .4));
      p.el.style.transform = `translate(${p.from * (1 - k) + jx}px,${jy}px) rotate(${p.rot + (1 - k) * 7 * Math.sign(p.from) + jr}deg)`;
      return;
    }
    const e = clamp(ease.outBack(inP), 0, 1.05);
    const flat = clamp(e);
    const noise = (1 - flat) * 10;
    const mix = (pa, pb) => pa.map(([x, y], k) => [lerp(pb[k][0], x, flat) + (hash(frame, k + p.idx * 7) - .5) * noise,
      lerp(pb[k][1], y, flat) + (hash(frame + 3, k + p.idx * 7) - .5) * noise]);
    p.paperEl.style.clipPath = p.darkEl.style.clipPath = p.crumpleEl.style.clipPath = polyCSS(mix(p.poly, p.blob));
    p.crumpleEl.style.opacity = lerp(.95, .5, flat);
    p.fiberEl.style.clipPath = polyCSS(mix(p.fpoly, p.fblob));
    p.darkEl.style.opacity = .35 * (1 - flat);
    p.contentEl.style.opacity = flat > .85 ? 1 : 0;
    p.el.style.transform = `translate(${jx}px,${jy}px) rotate(${p.rot + (1 - flat) * 30 + jr}deg) scale(${lerp(.42, 1, e)})`;
  });
  tapes.forEach(tp => {
    const e = prog(aq, tp.t0, .17);
    tp.el.style.visibility = e > 0 ? 'visible' : 'hidden';
    tp.el.style.transform = `rotate(${tp.rot}deg) scale(${lerp(1.3, 1, e)})`;
  });
  drawDoodles(aq);
}
function sfxStrip() {
  const ev = [];
  pieces.forEach(p => {
    if (p.anim === 'slide') ev.push({ t: p.t0, type: 'paper_slide', dur: .45, gain: .4 }, { t: p.t0 + .3, type: 'flap', gain: .2 });
    else ev.push({ t: p.t0, type: 'crinkle', dur: .42, gain: .32, density: 130, f0: 600, f1: 1600 }, { t: p.t0 + .36, type: 'flap', gain: .3 });
  });
  tapes.forEach(tp => ev.push({ t: tp.t0, type: 'crinkle', dur: .12, gain: .14, density: 90, f0: 600, f1: 1400 }));
  doodles.forEach(d => ev.push({ t: d.t0, type: 'marker', dur: .3, gain: .22 }));
  return { master: { lp: 3000, verb: .12 }, events: ev };
}

/* ---------- 撕紙條：變體 3 ---------- */
// 把每一句做成紙條；o.layout(i, w, h) 回傳 { x, y }，o.paper(i) 回傳紙的材質和顏色
function stripLines(o) {
  const ls = lines();
  const font = s => `700 ${s}px ${FONT_ROUND}`;

let C;

  let y = (H - total) / 2 - 10;

  const M = 60;

    const pts = [];

    { clip: `circle(330px at ${160 + M}px ${140 + M}px)`, color: YELLOW },

    { clip: wave(-60, 2000, 930, 40, .004, 1.2), color: '#9fd5e0' },

  let html = `<div class="bg" style="${paperBg('#fff8ec', TEX.white, 1200)}"></div>`;
  html += cuts.map((c, i) => `<div class="blob" style="position:absolute;inset:0;filter:drop-shadow(0 6px 9px rgba(80,50,10,.28))"><div style="position:absolute;inset:-${M}px;clip-path:${c.clip};${paperBg(c.color, TEX.white, 900, `${i * 137}px ${i * 91}px`)}"></div></div>`).join('');
  const lineEls = [];

    lineEls.push({ i, y, h: lh[i], s: sz[i], text: l, last });
    y += lh[i];
  });
  scene.innerHTML = html;
  const lastL = lineEls[lineEls.length - 1];
  const tw = measure(lastL.text, font(lastL.s, 900)) * 1.05;
  doodles = [];
  // 第一句（hashtag）貼在一條紙膠帶上

  const tape = washi({ x: W / 2 - fw / 2, y: first.y + first.h * .12, w: fw, h: first.h * .76, rot: -1.5, z: 4,
    bg: 'repeating-linear-gradient(-45deg, rgba(60,177,200,.16) 0 14px, transparent 14px 28px), rgba(255,253,246,.88)' });
  tape.style.filter = 'drop-shadow(0 2px 3px rgba(80,50,10,.18))';
  // 最後一句後面一條撕邊的黃紙（從左往右露出來）
  const hw = tw + 80, hh = lastL.s * .55;
  const hl = scrap({ x: W / 2 - hw / 2, y: lastL.y + lastL.h / 2 + lastL.s * .02, w: hw, h: hh, rot: -1.2, color: YELLOW, amp: [4, 10, 4, 10], z: 3 });
  makeDoodle({ shape: 'sparkle', x: W / 2 + tw / 2 - 10, y: lastL.y - 70, size: 130, rot: 8, color: ORANGE, t0: 2.95, draw: .3 });
  scene.querySelectorAll('.ln').forEach(e => e.style.zIndex = 5);

    blobs: [...scene.querySelectorAll('.blob')],
    lines: [...scene.querySelectorAll('.ln')].map((el, i) => ({ el, chars: [...el.querySelectorAll('.ch')], t0: [.2, .95, 1.75][i] ?? (.2 + i * .75), last: i === ls.length - 1 })),

// 在 parent 裡垂直置中排好每一句，回傳每一句的資料（逐字動畫用）
function buildLines(parent, ls, sz, cy, t0s, opt = {}) {
  const lh = sz.map((s, i) => s * (i === ls.length - 1 ? 1.3 : 1.45));
  const gap = opt.gap ?? 24;
  let y = cy - (lh.reduce((a, b) => a + b, 0) + gap) / 2;
  return ls.map((l, i) => {
    const last = i === ls.length - 1;
    if (last) y += gap;
    const el = document.createElement('div');
    el.className = 'ln';
    el.style.cssText = `top:${y}px;height:${lh[i]}px;line-height:${lh[i]}px;font-family:${FONT_BOLD};font-weight:${last || isTag(l) ? 900 : 700};font-size:${sz[i]}px;color:${opt.colors ? opt.colors[i] : colorOf(l)};letter-spacing:.05em;z-index:${opt.z || 5}`;
    el.innerHTML = [...l].map(c => `<span class="ch">${esc(c)}</span>`).join('');
    parent.appendChild(el);
    const o = { el, chars: [...el.querySelectorAll('.ch')], t0: t0s[i] ?? (t0s[t0s.length - 1] + .5 * (i - t0s.length + 1)), last, y, h: lh[i], s: sz[i], text: l };
    y += lh[i];
    return o;
  });
}
// 前面幾句一個字一個字浮上來；最後一句每個字彈出來
function animLines(L, t) {
  L.forEach(l => l.chars.forEach((c, k) => {
    if (l.last) {
      const e = ease.outBack(prog(t, l.t0 + k * .06, .42));
      c.style.opacity = clamp(prog(t, l.t0 + k * .06, .12));
      c.style.transform = `translateY(${(1 - clamp(e)) * 30}px) scale(${lerp(.55, 1, e)})`;
    } else {
      const e = ease.outCubic(prog(t, l.t0 + k * .04, .45));
      c.style.opacity = e;
      c.style.transform = `translateY(${(1 - e) * 34}px)`;
    }
  }));
}
// 最後一句後面一條撕邊黃紙，從左往右露出來
function makeHl(parent, l, t0, z = 3, color = YELLOW) {
  const tw = measure(l.text, `900 ${l.s}px ${FONT_BOLD}`) * 1.05;
  const hw = tw + 80, hh = l.s * .55;
  const el = scrap({ x: W / 2 - hw / 2, y: l.y + l.h / 2 + l.s * .02, w: hw, h: hh, rot: -1.2, color: color || YELLOW, amp: [4, 10, 4, 10], z }, parent);
  return { el, t0, tw };
}
function animHl(h, t) {
  const e = ease.outCubic(prog(t, h.t0, .4));
  h.el.style.visibility = e > 0 ? 'visible' : 'hidden';
  h.el.style.clipPath = `inset(-20px ${(1 - e) * 100}% -20px -20px)`;
}
const lineSfx = L => L.map((l, i) => ({ t: l.t0 + .05, type: 'kalimba', freq: [523, 659, 784][i % 3], gain: l.last ? .4 : .32 }));

function build() {
  pieces = []; doodles = []; tapes = []; seedN = 1; root = scene; SCAM = { rot: 0, push: .05 };
  cur3 = STYLES[P.style + P.v] || STYLES[P.style] || STYLES[Object.keys(STYLES).find(k => k.startsWith(P.style))] || STYLES.strip;
  cur3[0]();
  DUR = P.pre + ANIM + P.post;
}
function renderAt(t) { cur3[1](t - P.pre); }
function buildSfx() {
  const s = cur3[2]();
  s.events.forEach(e => e.t += P.pre);
  return s;
}

/* ---------------- 播放與輸出 ---------------- */
async function start() {
  await Promise.all([
    document.fonts.load(`700 80px ${FONT_ROUND}`, '學園'), document.fonts.load(`900 80px ${FONT_BOLD}`, '學園'), document.fonts.load(`700 80px ${FONT_BOLD}`, '學園'),
    ...Object.values(TEX).map(src => new Promise(res => { const im = new Image(); im.onload = im.onerror = res; im.src = src; })),
  ]);
  build();
  window.DUR = DUR; window.renderAt = renderAt; window.SFX = buildSfx();
  renderAt(0);
  // 全版背景，不需要透明檔
  window.OPAQUE = true;
  window.READY = true;
}

const $ = s => document.getElementById(s);
function fit() { if (!P.render) scene.style.transform = `scale(${$('stage').clientWidth / W})`; }
let t0 = performance.now(), playing = true, cur = 0;
function tick(now) {
  if (window.READY && playing) {
    cur = ((now - t0) / 1000) % (DUR + .6);
    renderAt(Math.min(cur, DUR));
    $('scrub').value = Math.min(cur, DUR) / DUR;
    $('time').textContent = `${Math.min(cur, DUR).toFixed(2)} / ${DUR.toFixed(2)}`;
  }
  requestAnimationFrame(tick);
}
if (!P.render) {
  ['style', 'v', 'title'].forEach(k => {
    $(k).value = P[k];
    $(k).addEventListener('change', () => { P[k] = $(k).value; build(); window.DUR = DUR; t0 = performance.now(); });
  });
  $('play').onclick = () => {
    playing = !playing; $('play').textContent = playing ? '暫停' : '播放';
    if (playing) t0 = performance.now() - cur * 1000;
  };
  $('scrub').oninput = e => {
    playing = false; $('play').textContent = '播放';
    cur = e.target.value * DUR; renderAt(cur);
    $('time').textContent = `${cur.toFixed(2)} / ${DUR.toFixed(2)}`;
  };
  addEventListener('resize', fit); fit();
  start().then(() => requestAnimationFrame(tick));
} else {
  start();
}
</script>
</body>
